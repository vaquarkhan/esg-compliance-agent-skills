name: Validate and Package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies
        run: pip install -r requirements-proof.txt

      - name: Python syntax smoke check
        run: python scripts/smoke_syntax.py

      - name: Validate skills
        run: python scripts/validate-skills.py

      - name: Validate assets registry
        run: python scripts/validate-assets.py

      - name: Validate plugin manifest
        run: python scripts/validate-plugin-manifest.py

      - name: Validate SME provenance on reference checklists
        run: python scripts/validate-sme-provenance.py

      - name: Validate CSRD scope example
        run: |
          pip install pyyaml
          python examples/csrd-e1-mapping/validate_scope.py

      - name: Run GHG inventory example
        run: python examples/ghg-inventory/run_inventory.py

      - name: GHG eval concern checklist
        run: python -m pytest evals/ -v

  lint:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff mypy types-PyYAML

      - name: Ruff check
        run: ruff check agent.py redaction.py scripts/ compliance_tests/ orchestration/

      - name: Ruff format check
        run: ruff format --check agent.py redaction.py scripts/ compliance_tests/ orchestration/

      - name: Mypy
        run: mypy agent.py redaction.py scripts/

  security:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install pip-audit bandit detect-secrets

      - name: pip-audit
        run: pip-audit -r requirements-lock.txt --strict --desc on || pip-audit -r requirements.txt --strict --desc on

      - name: Bandit
        run: bandit -r agent.py redaction.py scripts/ -c pyproject.toml

      - name: detect-secrets scan
        run: detect-secrets scan --baseline .secrets.baseline .

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest compliance_tests/ -v --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Demo agent smoke
        run: python scripts/demo_agent.py "Scope CSRD ESRS E1 for FY2025"

  package-vscode:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VS Code extension
        working-directory: vscode-extension
        run: vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: esg-compliance-agent-skills-vsix
          path: vscode-extension/*.vsix
